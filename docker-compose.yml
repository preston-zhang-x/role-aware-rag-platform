services:
  pycheck:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      sh -lc "python -m pip install --upgrade pip &&
              pip install -r requirements.txt &&
              python -c 'import fastapi,uvicorn,sqlalchemy,psycopg2,pydantic_settings; print(\"deps OK\")'"
