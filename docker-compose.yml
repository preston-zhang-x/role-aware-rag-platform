services:
  pycheck:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      sh -lc "pip install --disable-pip-version-check -r requirements.lock &&
              python -c 'import fastapi,uvicorn,sqlalchemy,psycopg2,pydantic_settings; print(\"deps OK\")'"
