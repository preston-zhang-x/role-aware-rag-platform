services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  pycheck:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      UV_LINK_MODE: copy
    command: >
      sh -lc "uv venv /tmp/uv-env &&
              VIRTUAL_ENV=/tmp/uv-env uv sync --locked --active &&
              VIRTUAL_ENV=/tmp/uv-env uv run --active --no-sync python -c 'import fastapi,uvicorn,sqlalchemy,psycopg2,pydantic_settings,openpyxl; print(\"deps OK\")'"
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  pgadmin_data:
  qdrant_data:
