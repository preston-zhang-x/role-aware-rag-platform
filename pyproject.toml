[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "role-aware-rag-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "sqlalchemy==2.0.31",
  "psycopg2-binary==2.9.9",
  "pydantic-settings==2.3.4",
  "alembic==1.13.2",
  "PyJWT==2.8.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "httpx==0.27.0"
]

