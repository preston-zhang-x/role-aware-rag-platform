[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "role-aware-rag-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "sqlalchemy==2.0.31",
  "psycopg2-binary==2.9.9",
  "pydantic-settings==2.3.4",
  "alembic==1.13.2",
  "PyJWT==2.8.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "httpx==0.27.0",
  "qdrant-client==1.17.0",
  "rank-bm25==0.2.2",
  "openai==1.12.0",
  "SudachiPy==0.6.10",
  "sudachidict_core==20260116",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.4",
  "markitdown==0.1.1",
  "xlrd==2.0.1",
  "llama-index-core==0.14.16",
  "llama-index-embeddings-openai==0.5.2",
  "llama-index-vector-stores-qdrant==0.9.2",
  "loguru==0.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]
namespaces = false
